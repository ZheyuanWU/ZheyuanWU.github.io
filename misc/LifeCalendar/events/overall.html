<div id="events">

<!--
Usage:
Put your events in divs.
Event metadata are discribed in tag attributes, include:
date: date for event in a day
start & end: dates for events that stretch across several days
icon(one-day event only): use a special icon on that day
color: use a special color on that day (one-off override, any CSS color)
Event contents can contain html, but it's recommended to keep it simple.

Life stages (class="base"):
start & end: exact dates, M/D/YYYY, must be valid calendar dates
stage-color (optional): a name from the fixed PALETTE in index.html
  (amber, teal, coral, indigo, moss, plum, steel, rose).
  Omit it and a color is auto-assigned in document order.
To add a new stage: just add one more <div class="base" ...> line below.
No changes to index.html are needed unless you want a specific color.
-->

<!-- Periods -->
<div class="base" start="9/30/2017" end="2/28/2019" stage-color="amber"><i>x1</i></div>
<div class="base" start="3/1/2019" end="2/28/2021" stage-color="teal"><i>x2</i></div>
<div class="base" start="3/1/2021" end="9/20/2021" stage-color="coral"><i>Clausthal</i></div>
<div class="base" start="9/21/2021" end="8/20/2025" stage-color="indigo"><i>Saarland</i></div>
<div class="base" start="8/21/2025" end="8/31/2032" stage-color="moss"><i>Providence</i></div>

</div>
