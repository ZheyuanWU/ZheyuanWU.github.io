<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.2/rollups/aes.js" integrity="sha256-/H4YS+7aYb9kJ5OKhFYPUjSJdrtV6AeyJOtTkw6X72o=" crossorigin="anonymous"></script>
  <title>Life Calendar</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #222222;
      --muted: #8a8a8a;
      --border: #e2e2e2;
      --track: #eef0f1;
      --event-accent: #A349A4;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: "Source Sans Pro", "Lato", -apple-system, "San Francisco", "Helvetica Neue", Helvetica, Roboto, "Segoe UI", "Segoe WP", Arial, Ubuntu, sans-serif;
    }

    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px 22px 12px;
    }

    header { flex: 0 0 auto; text-align: center; }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .tagline { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    #timeline {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
      margin-top: 10px;
    }

    #grid-wrap { display: flex; gap: 6px; }

    #year-axis {
      position: relative;
      flex: 0 0 auto;
      width: 32px;
    }

    .year-label {
      position: absolute;
      left: 0;
      right: 2px;
      text-align: right;
      font-size: 0.6rem;
      color: var(--muted);
      transform: translateY(-0.55em);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #grid {
      display: grid;
    }

    .cell {
      position: relative;
      border-radius: 1px;
      cursor: pointer;
    }

    .cell.has-event {
      box-shadow: inset 0 0 0 1.3px var(--event-accent);
    }

    .cell.today {
      outline: 1.5px solid #111;
      outline-offset: -1.5px;
      z-index: 2;
    }

    .cell .glyph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      line-height: 1;
      pointer-events: none;
    }

    #tooltip {
      position: fixed;
      max-width: 260px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.78rem;
      line-height: 1.45;
      z-index: 50;
      pointer-events: none;
    }

    #tooltip.pinned { border-color: #222; pointer-events: auto; }

    #warnings {
      position: fixed;
      bottom: 8px;
      left: 8px;
      background: #fff3f0;
      border: 1px solid #e0a094;
      color: #9a3b2a;
      font-size: 0.68rem;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 40;
      max-width: 320px;
    }

    #pw-widget {
      position: fixed;
      bottom: 6px;
      right: 8px;
      font-size: 0.62rem;
      opacity: 0.3;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    #pw-widget:hover, #pw-widget:focus-within { opacity: 1; }
    #pw-widget input { width: 72px; font-size: 0.62rem; }
    #pw-widget button { font-size: 0.62rem; }

    @media (max-width: 640px) {
      h1 { font-size: 1.1rem; }
      #year-axis { width: 26px; }
      .year-label { font-size: 0.54rem; }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>LIFE Calendar</h1>
      <div class="tagline">only once</div>
    </header>
    <div id="timeline"></div>
  </div>

  <div id="tooltip" hidden></div>
  <div id="warnings" hidden></div>

  <div id="pw-widget">
    <input id="password" placeholder="password" />
    <button id="pw-btn">set</button>
  </div>

  <script>
    // ---------- config ----------
    const birth = new Date(1999, 6, 5);
    const EXPECTED_YEARS = 102;
    const death = new Date(1999 + EXPECTED_YEARS, 6, 5);
    const today = new Date();

    const eventFiles = ['./events/overall.html', './events/year2024.html'];

    // Fixed, limited, easy-to-tell-apart palette. Add stages via
    // events/overall.html using `stage-color="<name>"`; omit it to
    // auto-assign the next unused color in this order.
    const PALETTE = [
      { name: 'amber', hex: '#D9A441' },
      { name: 'teal', hex: '#2E8B87' },
      { name: 'coral', hex: '#D9705A' },
      { name: 'indigo', hex: '#4C5B8C' },
      { name: 'moss', hex: '#748C54' },
      { name: 'plum', hex: '#8C5A7C' },
      { name: 'steel', hex: '#5A7A94' },
      { name: 'rose', hex: '#B5576F' },
    ];
    const PALETTE_MAP = Object.fromEntries(PALETTE.map(p => [p.name, p.hex]));

    // Grid cell units, finest first. The renderer picks the finest one
    // whose resulting cell size still clears MIN_CELL for the current
    // viewport — so the grid gets coarser only when it truly has to.
    const UNITS = [
      { name: 'week', days: 7 },
      { name: 'month', days: 30.4368 },
      { name: 'quarter', days: 91.3105 },
      { name: 'year', days: 365.2425 },
    ];
    const MIN_CELL = 8; // px
    const GAP = 1.5; // px, gap between grid cells

    // ---------- state ----------
    let stages = [];        // {start, end, name, color} (ms timestamps)
    let events = [];        // {date, endDate?, name, color, icon} (ms timestamps)
    let dataWarnings = [];
    let stageColorIdx = 0;
    let password = getCookie('password');
    let pinnedEl = null;
    let cellData = [];      // parallel to rendered .cell elements, by index

    function getCookie(sKey) {
      return decodeURIComponent(document.cookie.replace(new RegExp("(?:(?:^|.*;)\\s*" + encodeURIComponent(sKey).replace(/[-.+*]/g, "\\$&") + "\\s*\\=\\s*([^;]*).*$)|^.*$"), "$1")) || null;
    }

    document.getElementById('pw-btn').onclick = () => {
      const pw = document.getElementById('password').value;
      document.cookie = `password=${pw};max-age=${365 * 24 * 3600}`;
      location.reload();
    };

    function warn(msg) {
      dataWarnings.push(msg);
      console.error('[LifeCalendar]', msg);
    }

    // Strict M/D/YYYY parser: rejects illegal calendar dates (e.g. Feb 31)
    // instead of silently letting them roll over into a different date.
    function parseStrictDate(str) {
      if (!str) return null;
      const m = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!m) { warn(`Unrecognized date "${str}" (expected M/D/YYYY)`); return null; }
      const month = +m[1], day = +m[2], year = +m[3];
      const d = new Date(year, month - 1, day);
      if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) {
        warn(`Invalid calendar date "${str}"`);
        return null;
      }
      return d;
    }

    function fmtDate(ms) {
      const d = new Date(ms);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function stripTags(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent.trim();
    }

    // ---------- emoji detection ----------
    // Simplified single-codepoint matcher covering the common emoji blocks.
    // Good enough for picking a glyph to show on a cell.
    function extractEmoji(s) {
      const res = /[\u{2600}-\u{27BF}\u{1F300}-\u{1FAFF}]/u.exec(s);
      return res ? res[0] : false;
    }

    // ---------- parsing ----------
    function decryptIfNeeded(el) {
      el.childNodes.forEach(n => {
        if (n.nodeType === Node.TEXT_NODE && n.textContent.trim().startsWith('*')) {
          if (password) {
            try {
              n.textContent = CryptoJS.AES.decrypt(n.textContent.trim().substring(1), password).toString(CryptoJS.enc.Utf8);
            } catch {
              n.textContent = '*decryption error';
            }
          } else {
            n.textContent = '*encrypted message';
          }
        }
      });
    }

    function processEventsDoc(el) {
      if (!el) return;
      Array.from(el.children).forEach(ev => {
        decryptIfNeeded(ev);
        const content = ev.innerHTML.trim();
        if (!content) return;

        if (ev.classList.contains('base')) {
          const start = parseStrictDate(ev.getAttribute('start'));
          const end = parseStrictDate(ev.getAttribute('end'));
          if (!start || !end) return;
          if (end <= start) { warn(`Stage "${stripTags(content)}" ends before (or on) its start date`); return; }

          let color;
          const colorName = ev.getAttribute('stage-color');
          if (colorName) {
            color = PALETTE_MAP[colorName];
            if (!color) warn(`Unknown stage-color "${colorName}" on stage "${stripTags(content)}", auto-assigning instead`);
          }
          if (!color) { color = PALETTE[stageColorIdx % PALETTE.length].hex; stageColorIdx++; }

          stages.push({ start: start.getTime(), end: end.getTime(), name: content, color });
        } else if (ev.getAttribute('date') != null) {
          const d = parseStrictDate(ev.getAttribute('date'));
          if (!d) return;
          events.push({
            date: d.getTime(),
            name: content,
            color: ev.getAttribute('color'),
            icon: ev.getAttribute('icon'),
          });
        } else if (ev.getAttribute('start') != null && ev.getAttribute('end') != null) {
          const s = parseStrictDate(ev.getAttribute('start'));
          const e = parseStrictDate(ev.getAttribute('end'));
          if (!s || !e) return;
          if (e < s) { warn(`Event "${stripTags(content)}" ends before its start date`); return; }
          events.push({ date: s.getTime(), endDate: e.getTime(), name: content, color: ev.getAttribute('color') });
        }
      });
    }

    async function loadEvents() {
      for (const file of eventFiles) {
        try {
          const res = await fetch(file);
          const text = await res.text();
          const doc = new DOMParser().parseFromString(text, 'text/html');
          processEventsDoc(doc.getElementById('events'));
        } catch (e) {
          warn(`Failed to load ${file}: ${e.message}`);
        }
      }
      stages.sort((a, b) => a.start - b.start);
      renderWarnings();
      buildGrid();
    }

    function renderWarnings() {
      const w = document.getElementById('warnings');
      if (dataWarnings.length === 0) { w.hidden = true; return; }
      w.hidden = false;
      w.textContent = `⚠ ${dataWarnings.length} data issue(s) ignored — see console`;
      w.title = dataWarnings.join('\n');
    }

    // ---------- grid layout ----------
    function stepDate(ms, unitName) {
      const d = new Date(ms);
      switch (unitName) {
        case 'week': d.setDate(d.getDate() + 7); break;
        case 'month': d.setMonth(d.getMonth() + 1); break;
        case 'quarter': d.setMonth(d.getMonth() + 3); break;
        case 'year': d.setFullYear(d.getFullYear() + 1); break;
      }
      return d.getTime();
    }

    // Pick the finest unit + column count that packs the whole lifespan
    // into a near-square-cell grid fitting the available box.
    function pickGrid(availW, availH) {
      const totalDays = (death.getTime() - birth.getTime()) / 86400000;
      const aspect = Math.max(0.2, Math.min(5, availW / availH));
      let chosen = null;
      for (const u of UNITS) {
        const N = Math.max(1, Math.ceil(totalDays / u.days));
        const C = Math.max(1, Math.round(Math.sqrt(N * aspect)));
        const R = Math.ceil(N / C);
        const cell = Math.min((availW - (C - 1) * GAP) / C, (availH - (R - 1) * GAP) / R);
        chosen = { unit: u, C, cell };
        if (cell >= MIN_CELL || u.name === 'year') break;
      }
      return chosen;
    }

    function findCellIndex(boundaries, ms) {
      let lo = 0, hi = boundaries.length - 2;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (boundaries[mid] <= ms) lo = mid; else hi = mid - 1;
      }
      return lo;
    }

    function stageForRange(s0, s1) {
      let best = null, bestOverlap = 0;
      stages.forEach(st => {
        const overlap = Math.min(st.end, s1) - Math.max(st.start, s0);
        if (overlap > bestOverlap) { bestOverlap = overlap; best = st; }
      });
      return best;
    }

    function eventsForRange(s0, s1) {
      return events.filter(ev => ev.endDate != null
        ? (ev.date < s1 && ev.endDate > s0)
        : (ev.date >= s0 && ev.date < s1));
    }

    function cellTooltip(d) {
      let html = `<b>${fmtDate(d.s0)} – ${fmtDate(d.s1 - 1)}</b>`;
      if (d.st) html += `<br>${d.st.name}`;
      d.evs.forEach(e => {
        html += `<br>• ${fmtDate(e.date)}${e.endDate != null ? (' → ' + fmtDate(e.endDate)) : ''}: ${e.name}`;
      });
      if (today.getTime() >= d.s0 && today.getTime() < d.s1) {
        html += `<br><i>— today (${fmtDate(today.getTime())})</i>`;
      }
      return html;
    }

    function buildGrid() {
      const timelineEl = document.getElementById('timeline');
      timelineEl.innerHTML = '';
      const availW = Math.max(100, (timelineEl.clientWidth || 800) - 40);
      const availH = Math.max(60, timelineEl.clientHeight || 400);
      const picked = pickGrid(availW, availH);

      // Generate exact calendar-based cell boundaries (avoids drift from
      // using average unit lengths). Underlying dates stay exact; only the
      // display groups them into `picked.unit` chunks.
      const boundaries = [birth.getTime()];
      let cur = birth.getTime();
      const deathMs = death.getTime();
      while (cur < deathMs) {
        cur = stepDate(cur, picked.unit.name);
        if (cur > deathMs) cur = deathMs;
        boundaries.push(cur);
      }
      const N = boundaries.length - 1;
      const C = picked.C;
      const R = Math.ceil(N / C);
      const cellPx = Math.max(3, Math.floor(Math.min((availW - (C - 1) * GAP) / C, (availH - (R - 1) * GAP) / R) * 10) / 10);

      // sparse year axis labels
      const totalYears = Math.max(1, Math.round((deathMs - birth.getTime()) / (365.2425 * 86400000)));
      const niceSteps = [1, 2, 5, 10, 20, 25, 50];
      const labelStep = niceSteps.find(s => s >= totalYears / 16) || 50;

      const wrap = document.createElement('div');
      wrap.id = 'grid-wrap';

      const axis = document.createElement('div');
      axis.id = 'year-axis';
      axis.style.height = (R * cellPx + (R - 1) * GAP) + 'px';

      const birthYear = birth.getFullYear();
      const labelRows = new Set();
      const addLabel = (ms, text) => {
        const idx = findCellIndex(boundaries, ms);
        const row = Math.floor(idx / C);
        if (labelRows.has(row)) return;
        labelRows.add(row);
        const lbl = document.createElement('div');
        lbl.className = 'year-label';
        lbl.style.top = (row * (cellPx + GAP)) + 'px';
        lbl.textContent = text;
        axis.appendChild(lbl);
      };
      addLabel(birth.getTime(), birthYear); // always mark the start of the range
      for (let y = birthYear; y <= death.getFullYear(); y += labelStep) {
        const ms = new Date(y, 0, 1).getTime();
        if (ms < birth.getTime() || ms >= deathMs) continue;
        addLabel(ms, y);
      }
      addLabel(deathMs - 1, death.getFullYear()); // always mark the end of the range

      const grid = document.createElement('div');
      grid.id = 'grid';
      grid.style.gridTemplateColumns = `repeat(${C}, ${cellPx}px)`;
      grid.style.gridAutoRows = `${cellPx}px`;
      grid.style.gap = GAP + 'px';

      cellData = new Array(N);
      const todayMs = today.getTime();
      const frag = document.createDocumentFragment();
      for (let i = 0; i < N; i++) {
        const s0 = boundaries[i], s1 = boundaries[i + 1];
        const st = stageForRange(s0, s1);
        const evs = eventsForRange(s0, s1);
        cellData[i] = { s0, s1, st, evs };

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = i;
        cell.style.background = st ? st.color : 'var(--track)';

        if (evs.length) {
          cell.classList.add('has-event');
          const withColor = evs.find(e => e.color);
          const withIcon = evs.find(e => e.icon);
          if (withColor) cell.style.background = withColor.color;
          if (withIcon) {
            cell.style.backgroundImage = `url("${withIcon.icon}")`;
            cell.style.backgroundSize = 'cover';
          } else {
            const emo = evs.map(e => extractEmoji(stripTags(e.name))).find(Boolean);
            if (emo) {
              const g = document.createElement('span');
              g.className = 'glyph';
              g.textContent = emo;
              cell.appendChild(g);
            }
          }
        }
        if (todayMs >= s0 && todayMs < s1) cell.classList.add('today');

        frag.appendChild(cell);
      }
      grid.appendChild(frag);

      wrap.appendChild(axis);
      wrap.appendChild(grid);
      timelineEl.appendChild(wrap);
    }

    // ---------- tooltip / interaction (event delegation on the grid) ----------
    const tooltip = document.getElementById('tooltip');

    function positionTooltip(x, y) {
      const pad = 12;
      let left = x + pad, top = y + pad;
      const rect = tooltip.getBoundingClientRect();
      if (left + rect.width > window.innerWidth - 8) left = Math.max(8, x - rect.width - pad);
      if (top + rect.height > window.innerHeight - 8) top = Math.max(8, window.innerHeight - rect.height - 8);
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }

    function showTooltip(html, x, y) {
      tooltip.innerHTML = html;
      tooltip.hidden = false;
      positionTooltip(x, y);
    }

    function hideTooltip() {
      if (!pinnedEl) tooltip.hidden = true;
    }

    function pinCell(cell, x, y) {
      if (pinnedEl === cell) {
        pinnedEl = null;
        tooltip.hidden = true;
        tooltip.classList.remove('pinned');
        return;
      }
      pinnedEl = cell;
      tooltip.classList.add('pinned');
      showTooltip(cellTooltip(cellData[+cell.dataset.idx]), x, y);
    }

    document.getElementById('timeline').addEventListener('mouseover', e => {
      const cell = e.target.closest('.cell');
      if (!cell || pinnedEl) return;
      showTooltip(cellTooltip(cellData[+cell.dataset.idx]), e.clientX, e.clientY);
    });
    document.getElementById('timeline').addEventListener('mousemove', e => {
      if (pinnedEl) return;
      if (e.target.closest('.cell')) positionTooltip(e.clientX, e.clientY);
    });
    document.getElementById('timeline').addEventListener('mouseout', e => {
      if (e.target.closest('.cell') && !pinnedEl) hideTooltip();
    });
    document.getElementById('timeline').addEventListener('click', e => {
      const cell = e.target.closest('.cell');
      if (!cell) return;
      e.stopPropagation();
      pinCell(cell, e.clientX, e.clientY);
    });

    document.addEventListener('click', () => {
      if (pinnedEl) {
        pinnedEl = null;
        tooltip.hidden = true;
        tooltip.classList.remove('pinned');
      }
    });

    // ---------- boot ----------
    loadEvents();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildGrid, 120);
    });
  </script>
</body>

</html>
